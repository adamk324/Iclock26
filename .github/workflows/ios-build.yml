name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Generate iOS project
        run: flutter create --platforms=ios --no-pub .

      - name: Set iOS 15 deployment target, app name, and icon
        run: |
          mkdir -p ios/Runner/Assets.xcassets/AppIcon.appiconset
          sips -s format png -z 1024 1024 AppIcon.jpg \
            --out ios/Runner/Assets.xcassets/AppIcon.appiconset/AppIcon.png
          python3 - <<'PY'
          from pathlib import Path
          import json
          import plistlib
          import re

          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          project_text, project_count = re.subn(
              r"(IPHONEOS_DEPLOYMENT_TARGET\s*=\s*)[0-9.]+;",
              r"\g<1>15.0;",
              project.read_text(),
          )
          if project_count == 0:
              raise SystemExit("Could not find the iOS deployment target in the Xcode project")
          project.write_text(project_text)

          icon_set = Path("ios/Runner/Assets.xcassets/AppIcon.appiconset")
          contents_path = icon_set / "Contents.json"
          contents = json.loads(contents_path.read_text())
          contents["images"] = [{
              "filename": "AppIcon.png",
              "idiom": "universal",
              "platform": "ios",
              "size": "1024x1024",
          }]
          contents_path.write_text(json.dumps(contents, indent=2) + "\n")

          info_plist = Path("ios/Runner/Info.plist")
          with info_plist.open("rb") as source:
              info = plistlib.load(source)
          info["CFBundleDisplayName"] = "Clock*"
          with info_plist.open("wb") as destination:
              plistlib.dump(info, destination)
          PY

      - name: Build for iPhone SE (1st generation)
        run: flutter build ios --release --no-codesign

      - name: Package app as IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          /usr/bin/zip -qr Runner.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-15-iphone-se-unsigned-ipa
          path: build/ios/ipa/Runner.ipa
          if-no-files-found: error
          retention-days: 7
