name: iOS build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Set iOS 15 deployment target, app name, and bundle identifiers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import re

          project = Path("ios/Runner.xcodeproj/project.pbxproj")
          project_text, project_count = re.subn(
              r"(IPHONEOS_DEPLOYMENT_TARGET\s*=\s*)[0-9.]+;",
              r"\g<1>15.0;",
              project.read_text(),
          )
          if project_count == 0:
              raise SystemExit("Could not find the iOS deployment target in the Xcode project")

          bundle_pattern = r"com\.example\.[A-Za-z0-9_]+(\.RunnerTests)?"
          bundle_ids = list(re.finditer(bundle_pattern, project_text))
          runner_ids = [match for match in bundle_ids if match.group(1) is None]
          test_ids = [match for match in bundle_ids if match.group(1) is not None]
          if len(runner_ids) < 3 or not test_ids:
              raise SystemExit(
                  "Expected Runner Debug/Release/Profile and RunnerTests bundle identifiers"
              )
          project_text = re.sub(
              bundle_pattern,
              lambda match: "com.mint.clock" + (match.group(1) or ""),
              project_text,
          )
          if "com.example" in project_text:
              raise SystemExit("An example bundle identifier remains in the Xcode project")
          project.write_text(project_text)

          info_plist = Path("ios/Runner/Info.plist")
          with info_plist.open("rb") as source:
              info = plistlib.load(source)
          info["CFBundleDisplayName"] = "Clock*"
          with info_plist.open("wb") as destination:
              plistlib.dump(info, destination)
          PY

      - name: Build for iPhone SE (1st generation)
        run: flutter build ios --release --no-codesign

      - name: Package app as IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          /usr/bin/zip -qr Runner.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-15-iphone-se-unsigned-ipa
          path: build/ios/ipa/Runner.ipa
          if-no-files-found: error
          retention-days: 7
