name: ios_26_clock
description: Clock* - a lightweight Cupertino-style clock app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cupertino_icons: ^2.0.0
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  ios: true
  android: false
  image_path: assets/icon/icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: false
